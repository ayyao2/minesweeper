name: web-react

on:
  push:
    branches: [main]
    paths: ['web-react/**', '.github/workflows/web-react.yml']
  pull_request:
    paths: ['web-react/**', '.github/workflows/web-react.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web-react/playwright-report
            web-react/test-results
          retention-days: 7
